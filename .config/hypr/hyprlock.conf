# Background
background {
    monitor = eDP-1
    path = /home/aayush/dotfiles/.config/hypr/wallpapers/Wallpaper.png
}

# General
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgb(255, 255, 255)
    font_size = 160
    font_family = SF Pro Display Bold
    position = 0, 250
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B')"
    color = rgb(255, 255, 255)
    font_size = 30
    font_family = SF Pro Display Medium
    position = 0, 360
    halign = center
    valign = center
}

image {
    monitor =
    path = /home/aayush/.config/hypr/images/pfp.png 
    border_color = 0xffdddddd
    border_size = 0
    size = 150
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(255, 255, 255)
    font_size = 20
    font_family = SF Pro Display Bold
    position = 0, -180
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 160, 30
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.5)
    inner_color = rgba(255, 255, 255, 0)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i>Enter Password</i>
    hide_input = false
    position = 0, -250
    halign = center
    valign = center
    zindex = 2
}
